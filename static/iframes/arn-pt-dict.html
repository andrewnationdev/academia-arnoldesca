<style>
  /* Layout: fólio emoldurado como página de manuscrito; faixa heráldica no topo, título, busca fixa, verbetes em duas colunas sob capitulares rubricadas */
  :root {
    --bg: #d9cdb0;
    --panel: #f3ebd5;
    --ink: #2b2118;
    --ink-soft: #6a5b46;
    --line: #d2c4a1;
    --gold: #a98a3a;
    --rubric: #9f2a1d;
    --lapis: #2b4a86;
    --on-rubric: #f7f0dc;
    --mark: #ecd98f;
    --font-title: "Cinzel Decorative", "Cinzel", Georgia, serif;
    --font-label: "Cinzel", "Trajan Pro", Georgia, serif;
    --font-initial: "UnifrakturCook", "Cinzel", Georgia, serif;
    --font-text: "EB Garamond", Garamond, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #100d0a;
      --panel: #1b1611;
      --ink: #eadfc3;
      --ink-soft: #a99a7e;
      --line: #3b3226;
      --gold: #c9a24a;
      --rubric: #e26b58;
      --lapis: #8ea9e6;
      --on-rubric: #1b1611;
      --mark: #4a3d17;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #100d0a;
    --panel: #1b1611;
    --ink: #eadfc3;
    --ink-soft: #a99a7e;
    --line: #3b3226;
    --gold: #c9a24a;
    --rubric: #e26b58;
    --lapis: #8ea9e6;
    --on-rubric: #1b1611;
    --mark: #4a3d17;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-text);
    font-size: 18px;
    line-height: 1.4;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 48px;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--bg);
  }

  .folio {
    max-width: 960px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--gold);
    box-shadow: 0 0 0 4px var(--panel), 0 0 0 5px var(--line);
  }
  .band {
    height: 6px;
    background: repeating-linear-gradient(90deg, var(--rubric) 0 12px, var(--lapis) 12px 24px);
    border-bottom: 1px solid var(--gold);
  }
  .inner { padding: 8px 44px 36px; }

  .orn { display: flex; align-items: center; gap: 16px; }
  .orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .orn::after { background: linear-gradient(270deg, transparent, var(--gold)); }
  .orn span { width: 8px; height: 8px; background: var(--rubric); transform: rotate(45deg); outline: 1px solid var(--gold); outline-offset: 3px; }

  header.title { padding: 30px 0 4px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .eyebrow { font-family: var(--font-label); font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--rubric); }
  h1 {
    font-family: var(--font-title);
    font-weight: 700;
    font-size: clamp(27px, 6vw, 44px);
    line-height: 1.12;
    letter-spacing: 0.02em;
    margin: 0;
    text-wrap: balance;
  }
  .sub { margin: 0; font-style: italic; color: var(--ink-soft); font-size: 18px; }
  header.title .orn { width: min(100%, 420px); margin-top: 6px; }

  .controls {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--panel);
    margin-top: 18px;
    padding-block: 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .search { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--ink-soft); padding: 2px 0 6px; }
  .search:focus-within { border-bottom-color: var(--rubric); box-shadow: 0 1px 0 var(--rubric); }
  .search svg { flex: none; color: var(--ink-soft); }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink);
    font-family: var(--font-text); font-style: italic; font-size: 19px;
  }
  .search input::placeholder { color: var(--ink-soft); }
  .clear {
    border: 0; background: transparent; color: var(--ink-soft); cursor: pointer;
    font-family: var(--font-label); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 2px;
  }
  .clear:hover { color: var(--rubric); }

  .row-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
  .chip, .dir {
    font-family: var(--font-label);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 5px 9px;
    cursor: pointer;
    display: inline-flex;
    gap: 7px;
    align-items: baseline;
  }
  .chip:hover, .dir:hover { color: var(--ink); border-color: var(--gold); }
  .chip[aria-pressed="true"] { background: var(--rubric); border-color: var(--rubric); color: var(--on-rubric); }
  .chip .n { font-family: var(--font-text); font-size: 13px; letter-spacing: 0; opacity: 0.8; font-variant-numeric: tabular-nums; }
  .dir { color: var(--ink); border-color: var(--gold); }
  .dir .arrow { color: var(--rubric); letter-spacing: 0; }
  :is(button, input):focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }

  .meta { display: flex; flex-direction: column; gap: 4px; padding-block: 16px 0; }
  .count { font-family: var(--font-label); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 0; font-size: 15px; color: var(--ink-soft); }
  .legend i { color: var(--lapis); }

  .head { display: flex; align-items: center; gap: 14px; margin: 24px 0 10px; font-weight: 400; }
  .head::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); }
  .initial {
    display: grid; place-items: center; width: 46px; height: 46px; padding-bottom: 4px;
    font-family: var(--font-initial); font-weight: 700; font-size: 34px; line-height: 1;
    color: var(--rubric);
    box-shadow: inset 0 0 0 1px var(--gold), inset 0 0 0 4px var(--panel), inset 0 0 0 5px var(--gold);
  }

  .entries { list-style: none; margin: 0; padding: 0; column-count: 1; column-gap: 44px; }
  @media (min-width: 780px) { .entries { column-count: 2; column-rule: 1px solid var(--line); } }
  .entry { break-inside: avoid; padding: 4px 0 4px 1.1em; text-indent: -1.1em; overflow-wrap: anywhere; }
  .hw { font-weight: 600; font-size: 1.08em; }
  .ab { font-style: italic; color: var(--lapis); font-size: 0.92em; margin: 0 0.3em; }
  .arn.alt { font-style: italic; font-weight: 500; }
  .arn.alt::before { content: "\2014\00a0"; color: var(--gold); font-style: normal; }
  sup { font-size: 0.62em; line-height: 0; color: var(--rubric); font-weight: 600; margin-left: 1px; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

  .empty { padding: 56px 0 40px; text-align: center; font-style: italic; color: var(--ink-soft); }
  .empty b { display: block; font-style: normal; font-family: var(--font-label); letter-spacing: 0.06em; color: var(--ink); font-size: 18px; font-weight: 500; margin-bottom: 4px; }

  footer.end { margin-top: 36px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  footer.end .orn { width: 100%; }
  footer.end p { margin: 0; font-family: var(--font-label); font-size: 12px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--ink-soft); padding-left: 0.4em; }

  @media (max-width: 600px) {
    body { padding-block: 16px 32px; font-size: 17px; }
    .inner { padding: 4px 16px 28px; }
    header.title { padding-top: 22px; }
  }
</style>

"preposition"}, {"w": "fuori", "d": "fora, fora de", "p": "preposition"}, {"w": "siempre", "d": "sempre", "p": "adverb"}, {"w": "qualcosa", "d": "algo, alguma coisa", "p": "pronoun"}, {"w": "fin", "d": "até", "p": "preposition"}, {"w": "fin a", "d": "até", "p": "preposition"}, {"w": "fino a", "d": "até", "p": "preposition"}, {"w": "noialtri", "d": "nós", "p": "pronoun"}, {"w": "tiempo", "d": "tempo", "p": "noun"}, {"w": "diario", "d": "diário, jornal; diário (como adjetivo)", "p": "noun"}, {"w": "diaio", "d": "diário, jornal; diário (como adjetivo)", "p": "noun"}, {"w": "provar", "d": "tentar, experimentar, provar, testar", "p": "verb"}, {"w": "accossì", "d": "assim, desta maneira", "p": "adverb"}, {"w": "stoia", "d": "história, ficção", "p": "noun"}, {"w": "ciò", "d": "isto, isso", "p": "pronoun"}, {"w": "storia", "d": "história, ficção", "p": "noun"}];
  const POS = {
    noun: ["Substantivo", "s."], verb: ["Verbo", "v."], adjective: ["Adjetivo", "adj."],
    adverb: ["Advérbio", "adv."], pronoun: ["Pronome", "pron."], determiner: ["Determinante", "det."],
    numeral: ["Numeral", "num."], preposition: ["Preposição", "prep."], conjunction: ["Conjunção", "conj."],
    discourse: ["Discurso", "disc."]
  };
  const ORDER = Object.keys(POS);
  const state = { q: "", pos: "all", dir: "arn" };

  const $ = (id) => document.getElementById(id);
  const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const lead = (s) => s.replace(/^[^a-z]+/, "");
  const posInfo = (p) => POS[p] || [p, p + "."];

  const seen = {};
  DATA.forEach((e) => { e.nw = norm(e.w); e.nd = norm(e.d); seen[e.w] = (seen[e.w] || 0) + 1; e.n = seen[e.w]; });
  DATA.forEach((e) => { e.hom = seen[e.w] > 1; });

  function hl(text, q) {
    if (!q) return esc(text);
    const nt = norm(text);
    const i = nt.indexOf(q);
    if (i < 0 || nt.length !== text.length) return esc(text);
    return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
  }
  const word = (e, q) => hl(e.w, q) + (e.hom ? "<sup>" + e.n + "</sup>" : "");
  const ab = (p) => `<i class="ab" title="${esc(posInfo(p)[0])}">${esc(posInfo(p)[1])}</i>`;

  function buildRows(q) {
    const pool = DATA.filter((e) => state.pos === "all" || e.p === state.pos);
    if (state.dir === "arn") {
      return pool
        .filter((e) => !q || e.nw.includes(q) || e.nd.includes(q))
        .map((e) => ({ key: e.nw, html: `<span class="hw arn">${word(e, q)}</span> ${ab(e.p)} <span class="gl">${hl(e.d, q)}</span>` }));
    }
    const groups = new Map();
    pool.forEach((e) => {
      const k = e.d + "|" + e.p;
      if (!groups.has(k)) groups.set(k, { d: e.d, nd: e.nd, p: e.p, items: [] });
      groups.get(k).items.push(e);
    });
    return [...groups.values()]
      .filter((g) => !q || g.nd.includes(q) || g.items.some((e) => e.nw.includes(q)))
      .map((g) => ({ key: g.nd, html: `<span class="hw">${hl(g.d, q)}</span> ${ab(g.p)} <span class="arn alt">${g.items.map((e) => word(e, q)).join(", ")}</span>` }));
  }

  function renderChips() {
    const counts = { all: DATA.length };
    DATA.forEach((e) => { counts[e.p] = (counts[e.p] || 0) + 1; });
    const keys = ["all", ...ORDER.filter((p) => counts[p])];
    $("chips").innerHTML = keys.map((k) =>
      `<button class="chip" type="button" data-pos="${k}" aria-pressed="${state.pos === k}">${k === "all" ? "Todos" : posInfo(k)[0]}<span class="n">${counts[k]}</span></button>`
    ).join("");
  }

  function renderDir() {
    $("dir").innerHTML = state.dir === "arn"
      ? 'Arnoldesco <span class="arrow">→</span> Português'
      : 'Português <span class="arrow">→</span> Arnoldesco';
  }

  function render() {
    const q = norm(state.q.trim());
    const rows = buildRows(q);
    const loc = state.dir === "arn" ? "it" : "pt";
    rows.sort((a, b) => lead(a.key).localeCompare(lead(b.key), loc));

    $("count").textContent = rows.length === 1 ? "1 verbete" : rows.length + " verbetes";
    $("clear").hidden = !state.q;

    if (!rows.length) {
      $("list").innerHTML = '<div class="empty"><b>Nenhum verbete encontrado</b>Tente outra grafia ou remova o filtro de classe.</div>';
      return;
    }

    const groups = [];
    rows.forEach((r) => {
      const letter = (lead(r.key)[0] || "#").toUpperCase();
      const last = groups[groups.length - 1];
      if (last && last.letter === letter) last.items.push(r);
      else groups.push({ letter, items: [r] });
    });

    $("list").innerHTML = groups.map((g) =>
      `<section class="group"><h2 class="head"><span class="initial">${g.letter}</span></h2><ul class="entries">` +
      g.items.map((r) => `<li class="entry">${r.html}</li>`).join("") + "</ul></section>"
    ).join("");
  }

  $("q").addEventListener("input", (ev) => { state.q = ev.target.value; render(); });
  $("clear").addEventListener("click", () => { state.q = ""; $("q").value = ""; render(); $("q").focus(); });
  $("chips").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-pos]");
    if (!b) return;
    state.pos = b.dataset.pos;
    renderChips();
    render();
  });
  $("dir").addEventListener("click", () => { state.dir = state.dir === "arn" ? "pt" : "arn"; renderDir(); render(); });

  $("sub").textContent = DATA.length + " verbetes, com glosas em português";
  $("legend").innerHTML = "<span>Abreviaturas:</span>" + ORDER.map((k) => `<span><i>${POS[k][1]}</i> ${POS[k][0].toLowerCase()}</span>`).join("");
  renderChips();
  renderDir();
  render();
</script>
