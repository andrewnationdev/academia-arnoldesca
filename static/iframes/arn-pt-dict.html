<style>
  /* Layout: coluna única estreita, cabeçalho fixo com busca e filtros, lista de verbetes agrupada por letra */
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --fg: #14181f;
    --muted: #5d6675;
    --line: #e3e6ec;
    --accent: #2f4bd8;
    --accent-soft: #e8ecfd;
    --font-display: "Newsreader", Georgia, "Times New Roman", serif;
    --font-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218;
      --surface: #161a22;
      --fg: #e9ecf2;
      --muted: #98a1b2;
      --line: #252b36;
      --accent: #8fa2ff;
      --accent-soft: #1d2340;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218;
    --surface: #161a22;
    --fg: #e9ecf2;
    --muted: #98a1b2;
    --line: #252b36;
    --accent: #8fa2ff;
    --accent-soft: #1d2340;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 56px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header.top { padding-block: 40px 20px; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(34px, 7vw, 48px);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 8px 0 0;
    text-wrap: balance;
  }

  .controls {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--bg);
    padding-block: 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--bg);
  }
  .search {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0 12px;
    height: 46px;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { flex: none; color: var(--muted); }
  .search input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 16px;
  }
  .search input::placeholder { color: var(--muted); }
  .clear {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .clear:hover { color: var(--fg); }

  .row-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
  .chip {
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 11px;
    cursor: pointer;
    display: inline-flex;
    gap: 6px;
    align-items: baseline;
  }
  .chip:hover { color: var(--fg); border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .chip .n { font-family: var(--font-mono); font-size: 11px; opacity: 0.75; font-variant-numeric: tabular-nums; }

  .dir {
    font: inherit;
    font-size: 13px;
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    display: inline-flex;
    gap: 8px;
    align-items: center;
  }
  .dir:hover { border-color: var(--muted); }
  .dir .arrow { color: var(--accent); }
  :is(button, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .count { font-size: 13px; color: var(--muted); padding-block: 14px 4px; font-variant-numeric: tabular-nums; }

  .group { display: grid; grid-template-columns: 36px 1fr; column-gap: 8px; padding-top: 20px; }
  .letter {
    font-family: var(--font-display);
    font-size: 26px;
    line-height: 1.1;
    color: var(--accent);
    position: sticky;
    top: calc(var(--controls-h, 120px) + env(safe-area-inset-top, 0px) + 12px);
    align-self: start;
  }
  .entries { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); min-width: 0; }
  .entry {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 2px 12px;
    align-items: baseline;
    padding: 11px 2px;
    border-bottom: 1px solid var(--line);
  }
  .main { font-family: var(--font-display); font-size: 21px; line-height: 1.25; overflow-wrap: anywhere; }
  .sub { grid-column: 1; color: var(--muted); overflow-wrap: anywhere; }
  .pos {
    grid-column: 2;
    grid-row: 1;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 5px;
    padding: 2px 7px;
    white-space: nowrap;
  }
  .entry.eng .main { font-family: var(--font-body); font-size: 17px; font-weight: 500; }
  .entry.eng .sub { font-family: var(--font-display); font-size: 19px; color: var(--fg); }
  mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }

  .empty { padding: 56px 0; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--fg); font-family: var(--font-display); font-size: 22px; font-weight: 500; margin-bottom: 4px; }

  @media (max-width: 480px) {
    .group { grid-template-columns: 1fr; }
    .letter { position: static; padding-bottom: 6px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .chip, .dir, .search { transition: border-color .15s, background-color .15s, color .15s; }
  }
</style>

toria", "d": "história, ficção", "p": "noun"}];
  const POS_LABEL = {
    noun: "Substantivo", verb: "Verbo", adjective: "Adjetivo", adverb: "Advérbio",
    pronoun: "Pronome", numeral: "Numeral", preposition: "Preposição",
    conjunction: "Conjunção", discourse: "Discurso"
  };
  const POS_ORDER = ["noun", "verb", "adjective", "adverb", "pronoun", "numeral", "preposition", "conjunction", "discourse"];

  const state = { q: "", pos: "all", dir: "arn" };

  const $ = (id) => document.getElementById(id);
  const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  DATA.forEach((e) => { e.nw = norm(e.w); e.nd = norm(e.d); });

  function sortKey(e) {
    const s = state.dir === "arn" ? e.nw : e.nd;
    return s.replace(/^[^a-z]+/, "");
  }

  function highlight(text, q) {
    if (!q) return esc(text);
    const nt = norm(text);
    const i = nt.indexOf(q);
    if (i < 0 || nt.length !== text.length) return esc(text);
    return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
  }

  function renderChips() {
    const counts = { all: DATA.length };
    DATA.forEach((e) => { counts[e.p] = (counts[e.p] || 0) + 1; });
    const keys = ["all", ...POS_ORDER.filter((p) => counts[p])];
    $("chips").innerHTML = keys.map((k) =>
      `<button class="chip" type="button" data-pos="${k}" aria-pressed="${state.pos === k}">${k === "all" ? "Todos" : POS_LABEL[k]}<span class="n">${counts[k]}</span></button>`
    ).join("");
  }

  function renderDir() {
    $("dir").innerHTML = state.dir === "arn"
      ? 'Arnoldesco <span class="arrow">→</span> Português'
      : 'Português <span class="arrow">→</span> Arnoldesco';
  }

  function render() {
    const q = norm(state.q.trim());
    let rows = DATA.filter((e) =>
      (state.pos === "all" || e.p === state.pos) && (!q || e.nw.includes(q) || e.nd.includes(q))
    );
    rows.sort((a, b) => sortKey(a).localeCompare(sortKey(b), "it") || a.w.localeCompare(b.w, "it"));

    $("count").textContent = rows.length === 1 ? "1 verbete" : rows.length + " verbetes";
    $("clear").hidden = !state.q;

    if (!rows.length) {
      $("list").innerHTML = '<div class="empty"><b>Nenhum verbete encontrado</b>Tente outra grafia ou remova o filtro de classe.</div>';
      return;
    }

    const groups = [];
    rows.forEach((e) => {
      const letter = (sortKey(e)[0] || "#").toUpperCase();
      const last = groups[groups.length - 1];
      if (last && last.letter === letter) last.items.push(e);
      else groups.push({ letter, items: [e] });
    });

    const arn = state.dir === "arn";
    $("list").innerHTML = groups.map((g) =>
      `<section class="group"><div class="letter" aria-hidden="true">${g.letter}</div><ul class="entries">` +
      g.items.map((e) => {
        const w = highlight(e.w, q), d = highlight(e.d, q);
        return `<li class="entry${arn ? "" : " eng"}"><span class="main">${arn ? w : d}</span><span class="pos">${POS_LABEL[e.p] || esc(e.p)}</span><span class="sub">${arn ? d : w}</span></li>`;
      }).join("") + "</ul></section>"
    ).join("");
  }

  function syncOffset() {
    document.documentElement.style.setProperty("--controls-h", $("controls").offsetHeight + "px");
  }

  $("q").addEventListener("input", (ev) => { state.q = ev.target.value; render(); });
  $("clear").addEventListener("click", () => { state.q = ""; $("q").value = ""; render(); $("q").focus(); });
  $("chips").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-pos]");
    if (!b) return;
    state.pos = b.dataset.pos;
    renderChips();
    render();
  });
  $("dir").addEventListener("click", () => { state.dir = state.dir === "arn" ? "eng" : "arn"; renderDir(); render(); });
  window.addEventListener("resize", syncOffset);

  renderChips();
  renderDir();
  render();
  syncOffset();
</script>
